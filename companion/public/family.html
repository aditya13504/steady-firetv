<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%2314213d%27/%3E%3Ccircle cx=%2732%27 cy=%2718%27 r=%277%27 fill=%27%23f2c14e%27/%3E%3Cpath d=%27M32 28v22M20 30l12 2 12-2M14 52h36%27 stroke=%27%23f7f3ea%27 stroke-width=%275%27 stroke-linecap=%27round%27 fill=%27none%27/%3E%3C/svg%3E">
<title>Steady family updates</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap">
<style>
  :root { --bg: #eef1f6; --ink: #14213d; --muted: #5d6b85; --bubble: #ffffff; --alert: #f28b82; --ok: #7fc8a9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #dfe4ec; font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; color: var(--ink); min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .phone { width: min(400px, 100%); background: var(--bg); border-radius: 36px; padding: 18px 16px 22px; box-shadow: 0 30px 60px -30px #14213d66, inset 0 0 0 10px #14213d; min-height: 640px; display: flex; flex-direction: column; }
  header { text-align: center; padding: 18px 0 14px; border-bottom: 1px solid #d5dbe6; }
  header strong { display: block; font-size: 18px; }
  header span { font-size: 14px; color: var(--muted); }
  ol { list-style: none; margin: 0; padding: 14px 4px; display: flex; flex-direction: column; gap: 10px; flex: 1; overflow: auto; }
  li { align-self: flex-start; max-width: 90%; background: var(--bubble); border-radius: 18px 18px 18px 6px; padding: 10px 14px; font-size: 16px; line-height: 1.35; animation: pop .3s ease-out; }
  li.alert { background: var(--alert); color: #2a0b08; font-weight: 700; }
  li.resolved { background: var(--ok); color: #0e2a1f; }
  li time { display: block; font-size: 12px; font-weight: 400; opacity: .7; margin-top: 4px; }
  li.empty { background: none; color: var(--muted); align-self: center; animation: none; }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { li { animation: none; } }
</style>
</head>
<body>
  <main class="phone">
    <header><strong id="who">Steady</strong><span id="sub">Updates from home</span></header>
    <ol id="feed"><li class="empty">No updates yet.</li></ol>
  </main>
<script>
const feed = document.getElementById('feed');
function item(m) {
  const li = document.createElement('li');
  li.className = m.kind;
  li.textContent = m.text;
  const t = document.createElement('time');
  t.textContent = new Date(m.at).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' });
  li.append(t);
  return li;
}
fetch('/api/family').then(r => r.json()).then(d => {
  document.getElementById('who').textContent = `${d.family.name}'s phone`;
  document.getElementById('sub').textContent = `Steady updates from ${d.household.replace(/^The /, 'the ')}`;
  if (d.feed.length) feed.replaceChildren(...d.feed.slice(-12).map(item));
});
new EventSource('/api/family/events').onmessage = e => {
  feed.querySelector('.empty')?.remove();
  feed.append(item(JSON.parse(e.data)));
  feed.scrollTop = feed.scrollHeight;
  if (navigator.vibrate) navigator.vibrate(200);
};
</script>
</body>
</html>
